kind = "web"
previewPath = "/"
title = "Chikit - AI Medical ERP"
version = "1.0.0"
id = "artifacts/chikit"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21906
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/chikit run dev"

[services.env]
PORT = "21906"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/chikit", "run", "build"]
publicDir = "artifacts/chikit/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
